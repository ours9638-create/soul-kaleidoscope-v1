<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151225">
  <title>靈魂萬花筒｜語意審閱</title>
  <link rel="stylesheet" href="./semantic-review.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">Soul Kaleidoscope</p>
      <h1>語意審閱</h1>
      <p class="muted">同一頁支援年度解讀與主命數 Phrase JSON；不同模組分開保存，不互相覆蓋。</p>
    </header>

    <section class="card">
      <label class="file-label" for="jsonFile">選擇審閱 JSON</label>
      <input id="jsonFile" type="file" accept=".json,application/json">
      <div id="loadStatus" class="status">尚未載入檔案</div>
    </section>

    <section id="workspace" class="card hidden">
      <div class="toolbar">
        <button id="prevButton" type="button">上一則</button>
        <div class="counter"><span id="currentIndex">0</span> / <span id="totalCount">0</span></div>
        <button id="nextButton" type="button">下一則</button>
      </div>

      <div class="meta-grid">
        <div><span class="meta-label">模組</span><strong id="moduleLabel"></strong></div>
        <div><span class="meta-label">版本</span><strong id="versionLabel"></strong></div>
        <div><span class="meta-label">項目</span><strong id="itemLabel"></strong></div>
        <div><span class="meta-label">狀態</span><strong id="itemStatus"></strong></div>
      </div>

      <article>
        <h2 id="title"></h2>
        <div id="guardBox" class="guard hidden"></div>

        <h3>候選文字</h3>
        <div id="candidateText" class="copy-block"></div>

        <div id="originalSection" class="hidden">
          <h3>來源／原文</h3>
          <div id="originalText" class="copy-block secondary"></div>
        </div>

        <h3>你的修改文字</h3>
        <textarea id="revision" rows="7" placeholder="只有選「修改」時需要填。"></textarea>

        <h3>備註／原因</h3>
        <textarea id="note" rows="3" placeholder="可留空；若修改或暫緩，建議寫原因。"></textarea>

        <div class="decision-grid">
          <button class="decision approve" data-decision="approve" type="button">通過</button>
          <button class="decision revise" data-decision="revise" type="button">修改</button>
          <button class="decision hold" data-decision="hold" type="button">暫緩</button>
        </div>
        <div id="saveStatus" class="status"></div>
      </article>
    </section>

    <section id="exportCard" class="card hidden">
      <div class="summary">
        <span>已審 <strong id="reviewedCount">0</strong></span>
        <span>待審 <strong id="pendingCount">0</strong></span>
      </div>
      <button id="exportButton" class="primary" type="button">匯出目前審閱 JSON</button>
      <p class="muted small">匯出只保存人工審閱結果，不會自動升 Approved / Canonical / Runtime。</p>
    </section>
  </main>
  <script type="module" src="./semantic-review.js"></script>
</body>
</html>
